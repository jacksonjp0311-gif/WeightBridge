[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightbridge-research"
version = "0.1.0"
description = "Evidence-gated sandbox for AI-proposed weight edits, with reproducible toy evaluation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
safetensors = ["safetensors>=0.4"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["weightbridge*"]
