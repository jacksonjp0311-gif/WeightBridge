[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weightbridge-research"
version = "0.2.0"
description = "Portable evidence-gated neural weight inspection and editing research platform"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "psutil>=5.9"]

[project.optional-dependencies]
safetensors = ["safetensors>=0.4"]
test = ["pytest>=8"]
inference = ["torch>=2.5", "transformers>=4.51"]
figures = ["matplotlib>=3.8"]
benchmark = ["datasets>=3.0", "math-verify==0.9.0"]

[project.scripts]
weightbridge = "weightbridge.__main__:main"

[tool.setuptools.packages.find]
include = ["weightbridge*"]
